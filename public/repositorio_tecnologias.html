<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zury Engenharia</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
    }

    header{
      background:#111827;
      padding:20px;
      text-align:center;
      font-size:32px;
      font-weight:bold;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:30px;
    }

    .card{
      background:#1e293b;
      padding:25px;
      border-radius:12px;
    }

    .card h2{
      margin-top:0;
      color:#38bdf8;
    }

    .botao{
      display:inline-block;
      margin-top:15px;
      background:#2563eb;
      color:white;
      padding:10px 20px;
      border-radius:8px;
      text-decoration:none;
    }
  </style>
</head>

<body>

<header>
  Zury Engenharia
</header>

<div class="cards">

  <div class="card">
    <h2>Licitações</h2>
    <p>Painel de acompanhamento de editais e processos.</p>
    <a class="botao" href="#">Acessar</a>
  </div>

  <div class="card">
    <h2>Orçamentos</h2>
    <p>Controle de planilhas e custos de obras.</p>
    <a class="botao" href="#">Abrir</a>
  </div>

  <div class="card">
    <h2>Projetos</h2>
    <p>Gestão de projetos e documentos técnicos.</p>
    <a class="botao" href="#">Visualizar</a>
  </div>

</div>

</body>
</html>
